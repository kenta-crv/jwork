# J Work — Pages/Contracts 内製化 + Columns は drafity プロキシ維持
# Column 導線だけ nginx sub_filter で jwork の /column-cta.js を差し込む
#
# 削除する location（drafity プロキシ）:
#   - location ^~ /pages
#   - location ^~ /contracts
#
# 残す location:
#   - /remote-assets/
#   - /packs/
#   - /uploads/user/  (jwork local)
#   - /uploads/       (drafity proxy)
#   - /columns        (drafity proxy + CTA script 注入)
#   - location /      (puma) ← /column-cta.js /column_line_cta.json /images など

server {
    listen 443 ssl http2;
    server_name j-work.jp;

    ssl_certificate /etc/letsencrypt/live/j-work.jp/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/j-work.jp/privkey.pem;

    client_max_body_size 20M;

    # -----------------------------------------------------------
    # 1. 外部アセット (drafity.pro) — Columns 本文の CSS/JS 用
    # -----------------------------------------------------------
    location ^~ /remote-assets/ {
        proxy_pass https://drafity.pro/assets_ok/;
        proxy_set_header Host drafity.pro;
        proxy_ssl_server_name on;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    location ^~ /packs/ {
        proxy_pass https://drafity.pro/packs/;
        proxy_set_header Host drafity.pro;
        proxy_ssl_server_name on;
    }

    # -----------------------------------------------------------
    # uploads (jwork自身のユーザーアップロード画像はローカルから配信)
    # -----------------------------------------------------------
    location ^~ /uploads/user/ {
        root /opt/webroot/jwork/public;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # -----------------------------------------------------------
    # uploads (drafity.pro側のコラム画像など)
    # -----------------------------------------------------------
    location ^~ /uploads/ {
        proxy_set_header Host drafity.pro;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass https://drafity.pro;
        proxy_ssl_server_name on;
        proxy_redirect off;
        proxy_read_timeout 90;
        expires 30d;
        add_header Cache-Control "public, no-transform";
        proxy_cookie_domain drafity.pro j-work.jp;
    }

    # -----------------------------------------------------------
    # 2. /columns — 従来どおり drafity プロキシ（削除しない）
    #    末尾に jwork の導線スクリプトだけ差し込む
    # -----------------------------------------------------------
    location ^~ /columns {
        proxy_set_header Host drafity.pro;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Brand-Lp-Path /pages/cargo;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Accept-Encoding "";
        proxy_pass https://drafity.pro/cargo/columns;
        proxy_ssl_server_name on;
        proxy_redirect off;
        proxy_read_timeout 90;
        sub_filter_types text/html text/css application/javascript;
        sub_filter 'https://drafity.pro' 'https://j-work.jp';
        sub_filter 'http://drafity.pro' 'https://j-work.jp';
        sub_filter '/assets_ok/' '/remote-assets/';
        sub_filter '/assets/' '/remote-assets/';
        sub_filter '/cargo/columns' '/columns';
        # ★ 導線: drafity HTML はそのまま、jwork の JS だけ末尾注入
        sub_filter '</body>' '<script src="/column-cta.js" defer></script></body>';
        sub_filter_once off;
        proxy_cookie_domain drafity.pro j-work.jp;
    }

    location = /sitemap.xml.gz {
        root /opt/webroot/jwork/public;
        access_log off;
    }

    # -----------------------------------------------------------
    # 3. メインサイト（/pages /contracts /column-cta.js など）
    # -----------------------------------------------------------
    location / {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://unix:/run/puma/jwork.sock;
    }
}
