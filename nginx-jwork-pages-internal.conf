# J Work — Pages/Contracts 内製化 + Columns を jwork 経由に変更
#
# 削除する location（drafity 直プロキシ）:
#   - location ^~ /pages
#   - location ^~ /contracts
#   - location ^~ /columns   ★ 今回削除（jwork ColumnsController へ）
#
# 残す location（Columns の CSS/画像用）:
#   - /remote-assets/
#   - /packs/
#   - /uploads/user/  (jwork local)
#   - /uploads/       (drafity proxy)
#   - location /      (puma) ← /columns もここに落ちる
#
# /columns は jwork が drafity HTML を取得し、LINE 導線を注入して返す。

server {
    listen 443 ssl http2;
    server_name j-work.jp;

    ssl_certificate /etc/letsencrypt/live/j-work.jp/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/j-work.jp/privkey.pem;

    client_max_body_size 20M;

    # -----------------------------------------------------------
    # 1. 外部アセット (drafity.pro) — Columns 本文の CSS/JS 用
    # -----------------------------------------------------------
    location ^~ /remote-assets/ {
        proxy_pass https://drafity.pro/assets_ok/;
        proxy_set_header Host drafity.pro;
        proxy_ssl_server_name on;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    location ^~ /packs/ {
        proxy_pass https://drafity.pro/packs/;
        proxy_set_header Host drafity.pro;
        proxy_ssl_server_name on;
    }

    # -----------------------------------------------------------
    # uploads (jwork自身のユーザーアップロード画像はローカルから配信)
    # -----------------------------------------------------------
    location ^~ /uploads/user/ {
        root /opt/webroot/jwork/public;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # -----------------------------------------------------------
    # uploads (drafity.pro側のコラム画像など)
    # -----------------------------------------------------------
    location ^~ /uploads/ {
        proxy_set_header Host drafity.pro;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass https://drafity.pro;
        proxy_ssl_server_name on;
        proxy_redirect off;
        proxy_read_timeout 90;
        expires 30d;
        add_header Cache-Control "public, no-transform";
        proxy_cookie_domain drafity.pro j-work.jp;
    }

    # /columns の drafity 直プロキシは削除済み
    # → location / 経由で jwork ColumnsController が処理

    location = /sitemap.xml.gz {
        root /opt/webroot/jwork/public;
        access_log off;
    }

    # -----------------------------------------------------------
    # 2. メインサイト（/pages /contracts /columns 含む）
    # -----------------------------------------------------------
    location / {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://unix:/run/puma/jwork.sock;
    }
}
