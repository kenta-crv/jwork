# J Work — Pages/Contracts 内製化後の nginx 差分
#
# 削除する location（drafity プロキシ）:
#   - location ^~ /pages { ... }
#   - location ^~ /contracts { ... }
#
# 残す location（Columns 用）:
#   - /remote-assets/
#   - /packs/
#   - /uploads/user/  (jwork local)
#   - /uploads/       (drafity proxy)
#   - /columns
#   - location /      (puma)
#
# 適用後、/pages/* と /contracts/* は location / 経由で
# unix:/run/puma/jwork.sock に到達する。

server {
    listen 443 ssl http2;
    server_name j-work.jp;

    ssl_certificate /etc/letsencrypt/live/j-work.jp/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/j-work.jp/privkey.pem;

    client_max_body_size 20M;

    # -----------------------------------------------------------
    # 1. 外部アセット (drafity.pro) — Columns 用に残す
    # -----------------------------------------------------------
    location ^~ /remote-assets/ {
        proxy_pass https://drafity.pro/assets_ok/;
        proxy_set_header Host drafity.pro;
        proxy_ssl_server_name on;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    location ^~ /packs/ {
        proxy_pass https://drafity.pro/packs/;
        proxy_set_header Host drafity.pro;
        proxy_ssl_server_name on;
    }

    # -----------------------------------------------------------
    # uploads (jwork自身のユーザーアップロード画像はローカルから配信)
    # -----------------------------------------------------------
    location ^~ /uploads/user/ {
        root /opt/webroot/jwork/public;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # -----------------------------------------------------------
    # uploads (drafity.pro側のコラム画像など) — Columns 用に残す
    # -----------------------------------------------------------
    location ^~ /uploads/ {
        proxy_set_header Host drafity.pro;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass https://drafity.pro;
        proxy_ssl_server_name on;
        proxy_redirect off;
        proxy_read_timeout 90;
        expires 30d;
        add_header Cache-Control "public, no-transform";
        proxy_cookie_domain drafity.pro j-work.jp;
    }

    # -----------------------------------------------------------
    # 2. /columns — drafity プロキシ
    # -----------------------------------------------------------
    # パンくず用は Path だけ（ラベルは Draftiy の Genre名 + "LP" / "記事一覧"）
    #
    #   proxy_set_header X-Brand-Lp-Path /pages/cargo;
    #
    # 結果: トップ → Amazon配送LP(/pages/cargo) → Amazon配送記事一覧 → 記事
    # -----------------------------------------------------------
    location ^~ /columns {
        proxy_set_header Host drafity.pro;
        proxy_set_header X-Forwarded-Host $host;
        # ★ 親LPのURLだけ（日本語ヘッダー禁止。500の原因になる）
        proxy_set_header X-Brand-Lp-Path /pages/cargo;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Accept-Encoding "";
        proxy_pass https://drafity.pro/cargo/columns;
        proxy_ssl_server_name on;
        proxy_redirect off;
        proxy_read_timeout 90;
        sub_filter_types text/html text/css application/javascript;
        sub_filter 'https://drafity.pro' 'https://j-work.jp';
        sub_filter 'http://drafity.pro' 'https://j-work.jp';
        sub_filter '/assets_ok/' '/remote-assets/';
        sub_filter '/assets/' '/remote-assets/';
        sub_filter '/cargo/columns' '/columns';
        sub_filter_once off;
        proxy_cookie_domain drafity.pro j-work.jp;
    }

    # /pages と /contracts の location は削除済み
    # → 下の location / で jwork Puma が処理する

    location = /sitemap.xml.gz {
        root /opt/webroot/jwork/public;
        access_log off;
    }

    # -----------------------------------------------------------
    # 3. メインサイト（/pages /contracts 含む）
    # -----------------------------------------------------------
    location / {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://unix:/run/puma/jwork.sock;
    }
}
